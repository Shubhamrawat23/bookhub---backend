name: backend_deploy

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: localhost
      DB_NAME: bookhub
      DB_USER: sr_admin
      DB_PASSWORD: 123@123sr
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: bookhub
          POSTGRES_USER: sr_admin
          POSTGRES_PASSWORD: 123@123sr
        options: >-
          --health-cmd "pg_isready -U sr_admin -d bookhub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
  
    steps:
      - name: clone repo
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      
      - name: install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          until pg_isready -h localhost -p 5432 -U sr_admin; do sleep 1
          done

          python -m app.db.init_db && python -m app.db.seed_db
          pip install flake8 pytest
      
      - name: test backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics #syntax, invalid comparision, control flow errors & undefined variables'
          python -m pytest
  
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7

        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          source: "."
          target: "/home/shubham/bookhub/backend"
          exclude: ".git/**, .github/**, __pycache__/**, .venv/**, test_socket.py"
      
      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          script: |
            cd /home/shubham/bookhub/backend
            export POSTGRES_USER=${{ secrets.DB_USER }}
            export POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
            export POSTGRES_DB=${{ secrets.DB_NAME }}
            export SECRET_KEY=${{ secrets.SECRET_KEY_JWT }}
            docker compose up -d --build
